name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci
          cd ../admin && npm ci
          cd ../frontend && npm ci

      # The four manifests had drifted from the git tags (everything said 0.1.2
      # while v0.1.3 was tagged), and the server reported that stale number from
      # its hardcoded copy. APP_VERSION now reads server/package.json, so the
      # manifests must agree with each other and with the release tag.
      - name: Version consistency
        run: |
          node -e '
            const fs = require("fs");
            const files = ["package.json", "server/package.json", "admin/package.json", "frontend/package.json"];
            const versions = files.map((f) => [f, JSON.parse(fs.readFileSync(f, "utf8")).version]);
            const unique = [...new Set(versions.map(([, v]) => v))];
            for (const [f, v] of versions) console.log(f.padEnd(22), v);
            if (unique.length !== 1) {
              console.error("::error::package.json versions differ: " + unique.join(", "));
              process.exit(1);
            }
            const ref = process.env.GITHUB_REF || "";
            if (ref.startsWith("refs/tags/")) {
              const tag = ref.replace("refs/tags/v", "").replace("refs/tags/", "");
              if (tag !== unique[0]) {
                console.error("::error::tag " + ref + " does not match package version " + unique[0]);
                process.exit(1);
              }
            }
          '

      - name: Lint (errors block, warnings don't)
        run: npm run lint

      - name: Typecheck server
        run: cd server && npx tsc --noEmit

      - name: Run server tests with coverage
        run: cd server && npm run test:coverage

      - name: Build admin
        run: cd admin && npx tsc -b && npx vite build

      - name: Build frontend
        run: cd frontend && npx tsc -b && npx vite build

      - name: Compile server (production build)
        run: cd server && npx tsc

      - name: Install script syntax check
        run: bash -n install.sh

      # Surface known-vulnerable dependencies without blocking the build on
      # upstream advisories we haven't triaged yet. Tighten to a hard gate once
      # the baseline is clean.
      - name: Audit dependencies (non-blocking)
        continue-on-error: true
        run: |
          # `|| true` on each line: the shell runs with -e, so a non-zero exit
          # from the first audit would abort the step before the others run.
          npm audit --audit-level=high || true
          (cd server && npm audit --audit-level=high) || true
          (cd admin && npm audit --audit-level=high) || true
          (cd frontend && npm audit --audit-level=high) || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            server/dist
            admin/dist
            frontend/dist
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: server/coverage
          retention-days: 7

  # Tag pushes (v<version>) build the runtime image. Pushing it is optional: set
  # REGISTRY + REGISTRY_USERNAME + REGISTRY_PASSWORD (repository secrets) to
  # publish, otherwise the job still builds the image so the tag is verified.
  # Tag naming is documented in CHANGELOG.md — always `v<package.json version>`.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    env:
      REGISTRY: ${{ secrets.REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mortar:${{ github.ref_name }} .

      - name: Push image
        if: env.REGISTRY != ''
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
          for tag in "${{ github.ref_name }}" latest; do
            docker tag "mortar:${{ github.ref_name }}" "$REGISTRY/mortar:$tag"
            docker push "$REGISTRY/mortar:$tag"
          done
