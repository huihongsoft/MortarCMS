  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U mortar"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

volumes:
  mortar-data:
  mortar-uploads:
